<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>US RS Dashboard</title>
  <style>
    :root{--bg:#0d0f14;--fg:#dbe3ef;--muted:#9ca8ba;--line:#1f2533;--blue:#4ea1ff;--green:#31d07f;--amber:#f2b544;--red:#ff5f6d}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:'IBM Plex Sans',system-ui,sans-serif}
    .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
    .wrap{max-width:1440px;margin:0 auto;padding:16px}
    .head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .meta{font-size:13px;color:var(--muted)}
    .btn{background:#141b28;border:1px solid var(--line);color:var(--fg);padding:8px 10px;border-radius:8px;cursor:pointer}
    .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
    .tab{padding:8px 12px;border:1px solid var(--line);background:#111726;border-radius:8px;cursor:pointer}
    .tab.active{outline:2px solid var(--blue)}
    .panel{display:none}.panel.active{display:block}
    .controls{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:right}
    th:first-child,td:first-child{text-align:left}
    th{cursor:pointer;position:sticky;top:0;background:#111726}
    .badge{padding:2px 8px;border-radius:999px;font-size:11px}
    .sector{background:#1d2a42}.exch{background:#2a2444}.tf{background:#1f3a2a}
    .g{color:var(--green)}.r{color:var(--red)}.a{color:var(--amber)}
    .chips{display:flex;gap:6px;flex-wrap:wrap}
    .pill{padding:5px 10px;border-radius:999px;border:1px solid var(--line);cursor:pointer;background:#111726}
    .pill.active{outline:2px solid var(--green)}
    .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
    .card{background:#111726;border:1px solid var(--line);border-radius:10px;padding:12px}
    .bar{height:8px;background:#1b2130;border-radius:999px;overflow:hidden}
    .bar>span{display:block;height:100%;background:linear-gradient(90deg,#2db6ff,#31d07f)}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px}
    .modal.open{display:flex}.modal-box{background:#101522;border:1px solid var(--line);border-radius:12px;max-width:980px;width:100%;max-height:88vh;overflow:auto;padding:14px}
  </style>
</head>
<body><div class="wrap">
  <div class="head">
    <div>
      <h2 style="margin:0">US Relative Strength Dashboard</h2>
      <div class="meta mono" id="meta"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn" id="loadCsvBtn">↑ LOAD CSV</button>
      <input id="csvInput" type="file" accept=".csv,text/csv" style="display:none"/>
      <button class="btn" id="helpBtn">? HOW TO USE</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
</div>
<div class="modal" id="helpModal"><div class="modal-box">
  <div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">How To Use</h3><button class="btn" id="closeHelp">Close</button></div>
  <div class="tabs" id="helpTabs"></div><div id="helpPanels"></div>
</div></div>
<script>
